  <text x="92" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#E6EAF2">CachyOS AI Duo</text>
  <text x="92" y="202" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#9AA6BC">Two home PCs. One private, local AI desktop.</text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="20">
